name: Deploy Bot
on:
  workflow_dispatch:
  push:
    branches:
      - master
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get rep code
        uses: actions/checkout@v3
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Build
        run: go build -v

      - name: Test
        run: go test ./...

      - name: Copy single file to remote
        uses: appleboy/scp-action@v0.1.7
        with:
          # Скрипт перезапуска едет вместе с бинарём, а не живёт на сервере:
          # иначе он разойдётся с кодом, который перезапускает.
          source: |
            telebot
            deploy/restart.sh
          target: go-bot-test
          host: ${{ secrets.SERVER_ADDR }}
          username: ${{ secrets.SERVER_USR }}
          password: ${{ secrets.SERVER_PWD }}

      - name: multiple command
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_ADDR }}
          username: ${{ secrets.SERVER_USR }}
          password: ${{ secrets.SERVER_PWD }}
          # Перезапуск идёт через скрипт, а не напрямую: он поднимает
          # профилактику на время остановки, чтобы новые задачи не встали в
          # очередь, пока бот дожидается начатых, и возвращает её как было.
          # Голый `systemctl restart` этого не умел и срезал людей под нагрузкой.
          script: |
            chmod +rwx go-bot-test/telebot go-bot-test/deploy/restart.sh
            sudo bash go-bot-test/deploy/restart.sh
